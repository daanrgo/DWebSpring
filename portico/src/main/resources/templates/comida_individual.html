<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Comida</title>
    <link rel="stylesheet" href="/css/estiloComidaIndividual.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <div class="imagen-separadora">
        <img src="/images/NuevoLogo.png" alt="Decoración" />
    </div>

    <section class="detalle-container">
        <div class="info-hamburguesa">
            
            <h3 th:text="'Comida'">Comida</h3>
            <h1 th:text="${comida.name}">Nombre Comida</h1>
            
            <p class="ingredientes">
                <strong>Descripción:</strong> <span th:text="${comida.description}"></span>
            </p>
            
            <hr>
            <p class="info-extra"><strong>Precio:</strong> $<span th:text="${comida.price}"></span></p>
            <hr>
            
            <section class="adicionales-container">
                <h2>Adicionales</h2>
                <form th:object="${adicionalesDTO}" th:action="@{/comidas/add_adicionales}" method="post">
                    <!--input type="hidden" th:field="*{comidaId}"-->
                    <div class="categoria">
                        <div th:each="adicional : ${adicionalesDTO}" class="item">
                            
                            <label th:text="${adicional.name}"></label>
                            <span th:text="${adicional.price}" class="precio"></span>
                        </div>
                    </div>
                    <button type="submit" class="btn-carrito">AGREGAR AL CARRITO</button>
                </form>
            </section>

        </div>

        <div class="imagen-hamburguesa">
            <img th:src="${comida.imagen}" alt="Imagen de la comida">
        </div>
    </section>

    <footer class="footer">
        <div class="sobre_nosotros columna_footer">
            <ul class="list">
                <li><div class="logo_footer"><img src="/images/NuevoLogo.png" alt=""></div></li>
                <li><h3>Teléfono: 512-345-678</h3></li>
                <li><h3>Dirección: Paseo de la Castellana</h3></li>
                <li><h3>Bogotá - Colombia</h3></li>
            </ul>
        </div>

        <span class="division_vertical"></span>

        <div class="columna_footer">
            <ul class="list">
                <li><h2>Productos</h2></li>
                <li th:each="producto : ${productos}">
                    <a th:href="@{'/detalle/' + ${producto.id}}" th:text="${producto.name}"></a>
                </li>
            </ul>
        </div>

        <span class="division_vertical"></span>

        <div class="columna_footer">
            <ul class="list">
                <li><h2>Contacto</h2></li>
                <li><a href="#">FAQ</a></li>
                <li><a href="#">Servicio al Cliente</a></li>
                <li><a href="#">Sobre Nosotros</a></li>
                <li><a href="#">Políticas de Privacidad</a></li>
                <li class="social">
                    <a href="#"><i class='bx bxl-facebook-circle'></i></a>
                    <a href="#"><i class='bx bxl-linkedin-square'></i></a>
                    <a href="#"><i class='bx bxl-instagram'></i></a>
                </li>
            </ul>
        </div>
    </footer>
</body>
</html>
